<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>2027 풍산고 홍보책자 eBook</title>
<meta name="description" content="2027학년도 풍산고등학교 홍보책자를 책장 넘기듯 볼 수 있는 eBook">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;800&family=Jua&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
:root{
  --navy:#1D3A6B; --navy2:#2A5599; --sky:#86C0DF; --teal:#1F9E91; --sun:#EE8436;
  --ink:#1E2B3E;
  --f-display:"Jua","IBM Plex Sans KR","Malgun Gothic",sans-serif;
  --f-latin:"Barlow","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--navy);color:#fff;font:15px/1.5 var(--f-body);word-break:keep-all;overflow:hidden;
  background-image:radial-gradient(rgba(134,192,223,.22) 1.4px,transparent 1.6px);background-size:22px 22px}
button,select,a{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}
.app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}

.top{display:flex;align-items:center;gap:10px;padding:10px 16px;flex:none;position:relative;z-index:6}
.top img{width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 2px #fff}
.top .t{flex:1;min-width:0}
.top .t b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t span{font-family:var(--f-latin);font-weight:600;font-size:11px;letter-spacing:.18em;color:var(--sky)}
.top a.back{flex:none;text-decoration:none;font-size:13px;font-weight:700;background:rgba(255,255,255,.12);border-radius:99px;padding:7px 14px}
.top a.back:hover{background:rgba(255,255,255,.2)}

/* 책 화면: 이 자리에서 그대로 확대·축소 */
.stage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.zl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform-origin:0 0;will-change:transform}
.zl.anim{transition:transform .22s ease-out}
.stage.zoomed{cursor:grab}
.stage.zoomed.drag{cursor:grabbing}
#book .page{background:#fff}
#book .page img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.side{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.14);display:grid;place-items:center;cursor:pointer;z-index:5}
.side:hover{background:rgba(255,255,255,.26)}
.side.prev{left:10px}.side.next{right:10px}
.side svg{width:22px;height:22px}
.stage.zoomed .side{display:none}
@media (max-width:720px){.side{display:none}}

.zchip{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:5;display:none;align-items:center;gap:8px;background:rgba(10,20,40,.72);border-radius:99px;padding:5px 6px 5px 14px;font-size:13px;font-weight:700}
.zchip b{font-family:var(--f-latin);font-weight:800;font-variant-numeric:tabular-nums}
.zchip button{border:0;cursor:pointer;background:var(--sun);border-radius:99px;padding:5px 12px;font-size:12.5px;font-weight:700}
.stage.zoomed .zchip{display:flex}

.bar{flex:none;display:flex;align-items:center;gap:8px;padding:10px 12px 12px;justify-content:center;position:relative;z-index:6}
.btn{border:0;cursor:pointer;background:rgba(255,255,255,.12);border-radius:12px;padding:9px 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;line-height:1;flex:none;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.22)}
.btn.primary{background:var(--sun)}
.btn svg{width:18px;height:18px}
.pg{font-family:var(--f-latin);font-weight:800;font-size:15px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums;flex:none;white-space:nowrap}
.pg small{color:var(--sky);font-weight:600}
input[type=range]{width:min(360px,40vw);accent-color:var(--sun);min-width:0}
/* 휴대폰: 쪽수·슬라이더·목차를 한 줄로 */
@media (max-width:600px){
  .bar{gap:6px;padding:8px 10px 10px}
  .btn{padding:8px 9px}
  .pg{min-width:52px;font-size:14px}
  input[type=range]{flex:1;width:auto}
}

/* 목차 시트 */
.sheet-bg{position:fixed;inset:0;background:rgba(8,18,36,.55);z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:520px;z-index:21;background:#fff;color:var(--ink);border-radius:24px 24px 0 0;
  padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 16px);transform:translate(-50%,105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);max-height:80vh;overflow:auto}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#DCE6EE;margin:0 auto 10px}
.sheet h3{margin:0 0 8px;font-family:var(--f-latin);font-weight:800;font-size:22px;color:var(--navy2)}
.sheet ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.sheet button{width:100%;border:0;background:none;cursor:pointer;text-align:left;display:flex;gap:12px;align-items:center;padding:10px 8px;border-radius:12px;font-weight:600;font-size:15px}
.sheet button:hover{background:#E7F2F9}
.sheet button b{font-family:var(--f-latin);font-weight:800;color:var(--teal);width:26px}
.sheet button span.p{margin-left:auto;font-size:12px;color:#5A6A7E;font-family:var(--f-latin);font-weight:600}
body.toc-open .sheet-bg{opacity:1;pointer-events:auto}
body.toc-open .sheet{transform:translate(-50%,0)}

.hint{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(0,0,0,.6);border-radius:99px;padding:7px 14px;font-size:12.5px;z-index:7;transition:opacity .6s;pointer-events:none;white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <img src="pages/logo.png" alt="풍산고등학교 교표">
    <div class="t"><b>2027 풍산고등학교 홍보책자</b><span>POONGSAN HIGH SCHOOL · eBOOK</span></div>
    <a class="back" href="../">홍보 페이지</a>
  </header>

  <main class="stage" id="stage">
    <div class="zl" id="zl"><div id="book"></div></div>
    <button class="side prev" id="sPrev" aria-label="이전 페이지"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg></button>
    <button class="side next" id="sNext" aria-label="다음 페이지"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button>
    <div class="zchip" id="zchip">확대 <b id="zPct">100%</b><button id="zReset">원래 크기</button></div>
  </main>

  <nav class="bar" aria-label="페이지 이동">
    <button class="btn" id="bPrev" aria-label="이전"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg></button>
    <span class="pg" id="pg">1 <small>/ 24</small></span>
    <button class="btn" id="bNext" aria-label="다음"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button>
    <input type="range" id="slider" min="1" max="24" value="1" aria-label="페이지 선택">
    <button class="btn primary" id="bToc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>목차</button>
  </nav>
</div>

<div class="hint" id="hint"></div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" role="dialog" aria-label="목차">
  <div class="grab"></div>
  <h3>Contents</h3>
  <ol id="tocList"></ol>
</div>

<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
(function(){
  const N=24, PW=2480, PH=3307;
  const num=i=>String(i+1).padStart(2,'0');
  const V='?v=20261028b';
  const pages=[...Array(N)].map((_,i)=>'pages/'+num(i)+'.jpg'+V);
  const hd=[...Array(N)].map((_,i)=>'hd/'+num(i)+'.jpg'+V);
  const TOC=[['','표지',1],['','목차',3],['01','학교 소개',4],['02','교육과정 안내',5],['03','교과 활동 및 행사',6],['04','학생 맞춤형 프로그램',10],
    ['05','진로·진학 프로그램',12],['06','학생주도 프로그램',14],['07','동아리 활동',15],['08','학년 및 학급 프로그램',16],['09','도서관 프로그램',17],
    ['10','다양한 행사',18],['11','공간 혁신',19],['12','졸업생 추천사',20],['★','2027 신입생 원서접수 안내',22]];
  const $=id=>document.getElementById(id);
  const touchDevice=matchMedia('(pointer:coarse)').matches;
  const book=$('book'), stage=$('stage'), zl=$('zl');
  const imgs=[];
  pages.forEach((src,i)=>{const d=document.createElement('div');d.className='page';d.dataset.density=(i===0||i===N-1)?'hard':'soft';
    const im=document.createElement('img');im.src=src;im.alt=(i+1)+'쪽';im.decoding='async';d.appendChild(im);book.appendChild(d);imgs.push(im);});

  const wide=innerWidth>=720;
  function size(){const h=stage.clientHeight-12, w=stage.clientWidth-(wide?120:16);
    const ratio=PW/PH;let ph=h, pw=ph*ratio; const maxW=wide?w/2:w; if(pw>maxW){pw=maxW;ph=pw/ratio;} return {w:Math.floor(pw),h:Math.floor(ph)};}
  const s0=size();
  book.style.width=(wide?s0.w*2:s0.w)+'px'; book.style.height=s0.h+'px';
  const pf=new St.PageFlip(book,{width:s0.w,height:s0.h,size:'fixed',showCover:true,usePortrait:true,maxShadowOpacity:.45,mobileScrollSupport:false,flippingTime:700,drawShadow:true,autoSize:false});
  pf.loadFromHTML(book.querySelectorAll('.page'));

  const pg=$('pg'), slider=$('slider');
  const landscape=()=>pf.getOrientation()!=='portrait';
  function spreadOf(i){if(!landscape()||i===0||i===N-1)return [i];const l=(i%2===1)?i:i-1;return [l,Math.min(l+1,N-1)];}
  function label(idx){return idx.length>1?(idx[0]+1)+'-'+(idx[1]+1):String(idx[0]+1);}
  function show(){const idx=spreadOf(pf.getCurrentPageIndex());pg.innerHTML=label(idx)+' <small>/ '+N+'</small>';slider.value=idx[0]+1;}
  pf.on('flip',show); pf.on('changeOrientation',show); show();

  /* ---------- 제자리 확대·축소 ---------- */
  let s=1, x=0, y=0;
  const MAX=5;
  const zoomed=()=>s>1.001;
  function bookBox(){ // 확대 전(1배) 기준 책의 위치
    const vw=stage.clientWidth, vh=stage.clientHeight, bw=book.offsetWidth, bh=book.offsetHeight;
    return {vw,vh,bx:(vw-bw)/2,by:(vh-bh)/2,bw,bh};}
  function clamp(){const {vw,vh,bx,by,bw,bh}=bookBox();const w=bw*s,h=bh*s;
    x = w<=vw ? (vw-w)/2-bx*s : Math.min(-bx*s,Math.max(vw-w-bx*s,x));
    y = h<=vh ? (vh-h)/2-by*s : Math.min(-by*s,Math.max(vh-h-by*s,y));}
  function apply(anim){
    if(s<=1.001){s=1;x=0;y=0;}else clamp();
    zl.classList.toggle('anim',!!anim);
    zl.style.transform=s===1?'':'translate('+x+'px,'+y+'px) scale('+s+')';
    stage.classList.toggle('zoomed',zoomed());
    $('zPct').textContent=Math.round(s*100)+'%';
    if(s>1.3)sharpen();}
  function zoomAt(px,py,ns,anim){ns=Math.max(1,Math.min(MAX,ns));x=px-(px-x)*(ns/s);y=py-(py-y)*(ns/s);s=ns;apply(anim);}
  function reset(anim){s=1;apply(anim);}
  // 확대하면 보고 있는 쪽을 고화질 이미지로 바꿈
  function sharpen(){spreadOf(pf.getCurrentPageIndex()).forEach(k=>{const im=imgs[k];if(im.dataset.hd)return;im.dataset.hd='1';
    const big=new Image();big.onload=()=>{im.src=hd[k];};big.src=hd[k];});}
  const rel=(cx,cy)=>{const r=stage.getBoundingClientRect();return [cx-r.left,cy-r.top];};
  $('zReset').onclick=()=>reset(true);

  // 컴퓨터: 휠로 바로 확대·축소
  stage.addEventListener('wheel',e=>{e.preventDefault();const [px,py]=rel(e.clientX,e.clientY);
    const f=Math.min(1.12,Math.max(0.89,Math.exp(-e.deltaY*(e.ctrlKey?0.004:0.0012))));zoomAt(px,py,s*f,false);},{passive:false});

  // 컴퓨터: 확대된 상태에서만 마우스로 끌어서 이동(책장 넘기기는 막음)
  let mdrag=null;
  stage.addEventListener('mousedown',e=>{if(!zoomed()||e.button!==0)return;if(e.target.closest('.zchip'))return;
    e.preventDefault();e.stopPropagation();mdrag={cx:e.clientX,cy:e.clientY,x0:x,y0:y};stage.classList.add('drag');},true);
  addEventListener('mousemove',e=>{if(!mdrag)return;x=mdrag.x0+(e.clientX-mdrag.cx);y=mdrag.y0+(e.clientY-mdrag.cy);apply(false);},true);
  addEventListener('mouseup',()=>{if(mdrag){mdrag=null;stage.classList.remove('drag');}},true);
  stage.addEventListener('dblclick',e=>{if(e.target.closest('.zchip'))return;const [px,py]=rel(e.clientX,e.clientY);zoomAt(px,py,s<1.9?s*2:1,true);});

  // 휴대폰: 터치는 모두 여기서 직접 처리(책장 넘기기 기능에 넘기지 않음)
  //  - 한 손가락으로 옆으로 밀기: 책장 넘기기 (그 동작 중에 두 번째 손가락이 닿으면 넘기지 않음)
  //  - 두 손가락: 확대·축소, 확대된 상태에서 한 손가락: 이동, 두 번 탭: 2배
  let t=null, lastTap=0;
  const tlist=e=>[...e.touches].map(o=>rel(o.clientX,o.clientY));
  const mid=a=>[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2], dist=a=>Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);
  const skip=e=>e.target.closest('.zchip,.side');
  stage.addEventListener('touchstart',e=>{if(skip(e))return;e.preventDefault();e.stopPropagation();const p=tlist(e);
    if(p.length>=2){t={mode:'pinch',m:mid(p),d:dist(p)};return;}
    if(t&&t.mode==='none')return;
    t=zoomed()?{mode:'pan',p:p[0],moved:false}:{mode:'swipe',s0:p[0],p:p[0],moved:false};},{passive:false,capture:true});
  stage.addEventListener('touchmove',e=>{if(!t||skip(e))return;e.preventDefault();e.stopPropagation();const p=tlist(e);
    if(t.mode==='pinch'&&p.length>=2){const m=mid(p),d=dist(p);x+=m[0]-t.m[0];y+=m[1]-t.m[1];zoomAt(m[0],m[1],s*(d/t.d),false);t.m=m;t.d=d;return;}
    if(t.mode==='pan'&&p.length===1){x+=p[0][0]-t.p[0];y+=p[0][1]-t.p[1];t.p=p[0];t.moved=true;apply(false);return;}
    if(t.mode==='swipe'&&p.length===1){t.p=p[0];if(Math.hypot(t.p[0]-t.s0[0],t.p[1]-t.s0[1])>8)t.moved=true;}},{passive:false,capture:true});
  stage.addEventListener('touchend',e=>{if(!t||skip(e))return;e.preventDefault();e.stopPropagation();const left=e.touches.length;
    if(t.mode==='pinch'){if(left===0){if(s<1.06)reset(true);t=null;}else{t=zoomed()?{mode:'pan',p:tlist(e)[0],moved:true}:{mode:'none'};}return;}
    if(left>0)return;
    const done=t;t=null;
    if(done.mode==='swipe'){const dx=done.p[0]-done.s0[0],dy=done.p[1]-done.s0[1];
      if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2){dx<0?pf.flipNext('bottom'):pf.flipPrev('bottom');return;}}
    if(done.mode==='none'||done.moved)return;
    const now=Date.now(),pt=done.p||done.s0;if(now-lastTap<300){lastTap=0;zoomAt(pt[0],pt[1],s<1.9?2:1,true);}else lastTap=now;},{passive:false,capture:true});
  stage.addEventListener('touchcancel',()=>{t=null;},true);

  /* ---------- 이동 버튼·목차: 확대 중이면 먼저 원래 크기로 ---------- */
  const go=fn=>{if(zoomed())reset(false);fn();};
  $('bPrev').onclick=()=>go(()=>pf.flipPrev()); $('bNext').onclick=()=>go(()=>pf.flipNext());
  $('sPrev').onclick=()=>go(()=>pf.flipPrev()); $('sNext').onclick=()=>go(()=>pf.flipNext());
  slider.oninput=()=>go(()=>pf.turnToPage(+slider.value-1)); slider.onchange=show;
  const list=$('tocList');
  TOC.forEach(([n,tt,p])=>{const li=document.createElement('li');const b=document.createElement('button');
    b.innerHTML='<b>'+(n||'·')+'</b>'+tt+'<span class="p">'+p+'쪽</span>';b.onclick=()=>{closeToc();go(()=>pf.flip(p-1));};li.appendChild(b);list.appendChild(li);});
  const openToc=()=>document.body.classList.add('toc-open'), closeToc=()=>document.body.classList.remove('toc-open');
  $('bToc').onclick=openToc; $('sheetBg').onclick=closeToc;

  addEventListener('keydown',e=>{
    if(e.key==='Escape'){if(zoomed())reset(true);closeToc();return;}
    const [cx,cy]=[stage.clientWidth/2,stage.clientHeight/2];
    if(e.key==='+'||e.key==='='){zoomAt(cx,cy,s*1.2,true);return;}
    if(e.key==='-'){zoomAt(cx,cy,s/1.2,true);return;}
    if(e.key==='0'){reset(true);return;}
    if(e.key==='ArrowLeft')go(()=>pf.flipPrev()); if(e.key==='ArrowRight')go(()=>pf.flipNext());});

  // 가로 폭이 크게 바뀔 때만(회전 등) 현재 쪽을 기억하고 다시 맞춤
  let rt, lastW=innerWidth;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(Math.abs(innerWidth-lastW)<80){if(zoomed())apply(false);return;}
    location.hash='p'+(pf.getCurrentPageIndex()+1);location.reload();},400);});
  const m=location.hash.match(/^#p(\d+)$/); if(m){const k=Math.min(N,Math.max(1,+m[1]));setTimeout(()=>{pf.turnToPage(k-1);show();},0);}

  const hint=$('hint');
  hint.textContent=touchDevice?'옆으로 밀면 넘어가고, 두 손가락으로 벌리면 커져요':'휠로 확대·축소, 확대한 뒤에는 끌어서 이동';
  setTimeout(()=>{hint.style.opacity='0';},4500);
})();
</script>
</body>
</html>
